<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" fill="none" role="img" aria-label="Syntrax">
  <defs>
    <linearGradient id="sx" x1="4" y1="2" x2="76" y2="78" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6A63FF"/>
      <stop offset="0.4" stop-color="#0A00F4"/>
      <stop offset="1" stop-color="#0500A0"/>
    </linearGradient>
  </defs>
  <!-- Three discrete shapes: two left inward diamonds + one right full diamond.
       Gaps between them form the X negative space. -->
  <g fill="url(#sx)">
    <!-- Top-left inward diamond -->
    <path d="M5 6h20l13 14-13 14H5l13-14L5 6z"/>
    <!-- Bottom-left inward diamond -->
    <path d="M5 46h20l13 14-13 14H5l13-14L5 46z"/>
    <!-- Right full vertical diamond -->
    <path d="M57 5 76 40 57 75 43 40Z"/>
  </g>
</svg>
